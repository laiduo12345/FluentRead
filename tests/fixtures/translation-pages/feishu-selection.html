<!doctype html>
<html lang="en" translate="no">
<head><meta charset="utf-8"><title>Feishu selection compatibility fixture</title></head>
<body>
<!-- Synthetic block-editor structure; contains no user document content or credentials. -->
<main id="mainBox">
  <section class="bear-web-x-container">
    <div class="docx-page-block notranslate" data-block-type="page">
      <div class="block docx-text-block" data-block-type="text" data-block-id="first">
        <div class="zone-container text-editor notranslate" data-slate-editor="true" contenteditable="true">
          <div class="ace-line" data-node="true"><span id="first-text" data-string="true">Good ideas deserve attention.</span></div>
        </div>
      </div>
      <div class="block docx-text-block" data-block-type="text" data-block-id="second">
        <div class="zone-container text-editor notranslate" data-slate-editor="true" contenteditable="true">
          <div class="ace-line" data-node="true"><span id="second-text" data-string="true">Careful experiments make results reproducible.</span></div>
        </div>
      </div>
    </div>
  </section>
</main>
<p id="outside-text">Text outside the document editor.</p>
</body>
</html>
